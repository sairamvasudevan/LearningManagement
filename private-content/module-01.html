  <div class="lesson-intro"><div class="lesson-kicker">The first discipline of problem solving</div><h2 style="font-size:21px;color:#10223a;margin:6px 0">Do not solve the story. Solve the task hidden inside it.</h2><p>Real problem statements often describe a workplace, a customer, a system and several events before revealing what result is actually needed. Your first job is to identify that result without inventing extra work or jumping to a coding technique.</p><div><span class="time-chip">12 min · Learn</span><span class="time-chip">10 min · Worked example</span><span class="time-chip">13 min · Guided practice</span><span class="time-chip">18 min · Independent practice</span><span class="time-chip">5 min · Checkpoint</span><span class="time-chip">2 min · Review</span></div></div>
  <section class="lesson-section"><div class="lesson-kicker">Learning outcomes</div><h2>By the end of this lesson, you should be able to</h2><ul><li>Separate background information from the actual request.</li><li>Identify the real-world entity the problem asks you to count, find, compare or change.</li><li>Distinguish a required outcome from a suggested implementation technique.</li><li>Recognise scope creep: extra work that was not requested.</li><li>Spot an ambiguous term and ask for the missing definition instead of guessing.</li><li>Write a concise, faithful one-sentence task statement.</li></ul><div class="lesson-rule"><b>Boundary of this lesson</b><span>Today you are learning to identify <i>what the problem is asking</i>. The next lesson will turn a clear task into a formal input–rule–output description. Do not jump ahead to data structures or algorithms yet.</span></div></section>

  <section class="lesson-section"><div class="lesson-kicker">Part 1 · Learn one idea · 12 minutes</div><h2>A problem statement contains different kinds of information</h2><p>Consider a sentence such as: “Our delivery company works across twelve cities. Drivers scan a parcel at several points during its journey. The operations manager wants to know how many different parcels have a successful arrival scan at the North Hub on the previous day. The existing tracking records must not be changed.”</p><p>Every sentence is useful context, but not every sentence describes the requested result. Separate the information into three layers:</p>
   <div class="three-layers"><div class="layer-card"><b>01 · Context</b><strong>Why the problem exists</strong><p>The company operates across twelve cities. This explains the environment, but does not by itself define the requested calculation.</p></div><div class="layer-card"><b>02 · Relevant facts</b><strong>What changes the answer</strong><p>A parcel may generate several scans. The hub and date matter. The source records must remain unchanged.</p></div><div class="layer-card"><b>03 · Requested task</b><strong>What result is needed</strong><p>Count the different parcels recorded as reaching the North Hub yesterday.</p></div></div>
   <p>The skill is not to delete all background information. Context helps you understand the setting. The skill is to stop context from being mistaken for the task.</p>
   <h3>Find the action word</h3><p>Look for the verb that describes the result the person wants. Common task verbs include <b>count, find, identify, compare, rank, group, validate, select, summarise</b> and <b>transform</b>. The verb is a strong clue, but you must also identify what the verb acts on.</p>
   <h3>Name the thing being acted on</h3><p>Do not confuse an entity with a record of an event involving that entity. A customer can have many orders. A parcel can have many scan events. A learner can have many activity events. If the request asks for different customers, parcels or learners, counting rows or events may answer a different question.</p>
   <h3>Separate the requested outcome from an implementation idea</h3><div class="compare-grid"><div class="compare-card good"><div class="tag">Task statement</div><p>“Count the different customer IDs that placed an order on the specified date.”</p></div><div class="compare-card bad"><div class="tag">Implementation idea</div><p>“Use a set, loop through the rows and insert each ID.”</p></div></div><p>The implementation idea may eventually be useful. It is not the task. Two different algorithms could produce the same requested result. First agree on the result; choose the method later.</p>
   <div class="lesson-rule"><b>A useful task-statement pattern</b><span>[Action or result] + [real-world entity] + [qualifying condition] + [scope boundary, when stated]. Example: “Count distinct member identities with a successful entry at the Central Branch on Sunday; do not modify the access log.” This describes what must be achieved, not how to code it.</span></div>
   <h3>Do not silently expand the request</h3><p>If someone asks for a count, do not assume they also want a cleaned database, a dashboard, notifications or a prediction model. These may be sensible suggestions, but they are separate deliverables. Include them only when the stakeholder asks for them.</p>
   <h3>Ambiguity is a signal to clarify</h3><p>Words such as <b>active, recent, successful, late, duplicate</b> and <b>completed</b> can have more than one meaning. If different reasonable definitions change the answer, do not pick one just because it is convenient. Ask a short, specific clarification question.</p>
  </section>

  <section class="lesson-section"><div class="lesson-kicker">Part 2 · Study a worked example · 10 minutes</div><h2>From a long story to a precise task</h2>
   <div class="worked-case"><div class="case-label">Scenario · Public library entry report</div><p>A public library uses member cards at its entrance. The access log distinguishes successful entries from failed scan attempts. A member may generate more than one successful scan record during one arrival because the gate is slow to respond. The branch manager asks for the number of different members who entered the Central Branch on Sunday. The manager needs a count for a report; the library's access log must remain unchanged.</p><p><b>Pass 1 — Find the requested outcome.</b> The manager wants a number: how many different members entered.</p><p><b>Pass 2 — Identify the entity.</b> The entity is a member, not a scan, a card-read event or a row in the log.</p><p><b>Pass 3 — Keep the conditions that change the answer.</b> Central Branch and Sunday limit which entry records are relevant. Only successful entries qualify; repeat successful scan records from the same member should not create extra members.</p><p><b>Pass 4 — Preserve the scope.</b> The manager asked for a count. The log is not to be edited.</p><div class="answer-line">Task statement: Count the distinct member identities with at least one successful entry at the Central Branch on Sunday, without changing the access log.</div><div class="why"><p><b>Why this statement is faithful:</b> it names the result (a count), the entity (members), the relevant branch and date, and the explicit no-change condition. It does not prescribe a programming language, a data structure or a user-interface design.</p></div></div>
   <h3>Three plausible but incorrect interpretations</h3><div class="compare-grid"><div class="compare-card bad"><div class="tag">Wrong · Count the scans</div><p>A member whose card is scanned three times would be counted three times. That answers how many scan events occurred, not how many different members entered.</p></div><div class="compare-card bad"><div class="tag">Wrong · Clean the log</div><p>Deleting repeated scans changes the source record. The manager requested a count and explicitly said the access log must remain unchanged.</p></div><div class="compare-card bad"><div class="tag">Wrong · Build a dashboard</div><p>A dashboard may help present the result, but it is not part of the stated deliverable.</p></div><div class="compare-card good"><div class="tag">Correct · Count members</div><p>Count each member identity once among the qualifying entry records. Preserve the original records.</p></div></div>
   <div class="lesson-rule"><b>Use this test</b><span>Ask: “Would this work still be necessary if the requested result were produced correctly?” If the answer is no, it may be an implementation choice or an additional feature—not the task itself.</span></div>
  </section>

  <section class="lesson-section"><div class="lesson-kicker">Part 3 · Guided practice · 13 minutes</div><h2>Practise with support before working independently</h2><p>For each activity, write your own response first. Save it in the page, then open the model answer and compare your reasoning. These written responses are not graded by keyword matching: use the visible criteria to judge meaning. The objective checkpoint is marked securely by the course platform after each submission. The model answer is a reference, not a phrase that must be copied word for word.</p>
   <div class="activity-card"><div class="activity-time">Activity 1 · about 6 minutes</div><h3>Extract the task</h3><p>A sports venue’s entry system stores admitted-entry records. Due to gate retries, one visitor can appear in more than one admitted-entry record. The event manager asks: “How many different visitors entered Gate 3 during the evening session?” The scan history must be kept for auditing.</p><p><b>Your task:</b> Write one sentence that states the requested task. Do not describe an algorithm.</p><textarea maxlength="5000" id="activity-m1-a1" data-activity-id="m1-a1" placeholder="Write your one-sentence task statement here...">${esc(drafts['m1-a1']||'')}</textarea><div class="activity-actions"><button class="btn" data-action="save-activity" data-activity="m1-a1">Save my response</button><span class="activity-saved" id="saved-m1-a1">${drafts['m1-a1']?'Saved in this browser':'Not saved yet'}</span></div><details class="model-answer"><summary>Show model answer and self-check</summary><p>Count the distinct visitor identities with at least one recorded successful entry at Gate 3 during the evening session, while leaving the scan history unchanged.</p><div class="self-check"><div><b>✓ Entity:</b> visitors, not scans</div><div><b>✓ Outcome:</b> a count</div><div><b>✓ Conditions:</b> Gate 3 and evening session</div><div><b>✓ Scope:</b> preserve scan history</div></div></details></div>
   <div class="activity-card"><div class="activity-time">Activity 2 · about 7 minutes</div><h3>Find the missing definition</h3><p>A product team says: “Show us the number of active customers this month.” Its database contains customer profiles, orders, website visits and support requests. The team has not explained what “active” means.</p><p><b>Your task:</b> Write one clarification question that would prevent you from guessing the definition of active. Do not ask about programming language or data structures.</p><textarea maxlength="5000" id="activity-m1-a2" data-activity-id="m1-a2" placeholder="Write one precise clarification question...">${esc(drafts['m1-a2']||'')}</textarea><div class="activity-actions"><button class="btn" data-action="save-activity" data-activity="m1-a2">Save my response</button><span class="activity-saved" id="saved-m1-a2">${drafts['m1-a2']?'Saved in this browser':'Not saved yet'}</span></div><details class="model-answer"><summary>Show model answer and self-check</summary><p>“For this report, what should qualify a customer as active: at least one order this month, a website visit, a support interaction, or another agreed activity?”</p><p>A good clarification names the ambiguous term and offers plausible interpretations without choosing one on the stakeholder’s behalf.</p></details></div>
  </section>

  <section class="lesson-section"><div class="lesson-kicker">Part 4 · Independent practice · 18 minutes</div><h2>Now do the extraction without a worked solution</h2><p>Complete both cases before opening their model answers. For each case, state the requested result, identify the entity and keep only the relevant conditions. If a key term is undefined, write the clarification you need.</p>
   <div class="activity-card"><div class="activity-time">Independent case A · about 8 minutes</div><h3>Help-desk report</h3><p>An IT help desk wants to know how many different employees raised at least one support ticket during October. An employee may raise several tickets. A ticket may be reopened, creating additional status events. The report should contain only the number of employees. No ticket data should be changed.</p><p><b>Write:</b> (1) a one-sentence task statement; (2) one thing that should not be counted as a separate employee; and (3) one extra feature that is outside the request.</p><textarea maxlength="5000" id="activity-m1-a3" data-activity-id="m1-a3" placeholder="1. Task statement...&#10;2. Do not count...&#10;3. Outside the request...">${esc(drafts['m1-a3']||'')}</textarea><div class="activity-actions"><button class="btn" data-action="save-activity" data-activity="m1-a3">Save my response</button><span class="activity-saved" id="saved-m1-a3">${drafts['m1-a3']?'Saved in this browser':'Not saved yet'}</span></div><details class="model-answer"><summary>Show model answer and compare</summary><p><b>Task:</b> Count the distinct employee identities associated with tickets raised during October.</p><p><b>Do not count:</b> each ticket or each status event as a separate employee. One employee may have multiple tickets, and one ticket may generate multiple status events.</p><p><b>Outside scope:</b> deleting duplicate events, changing ticket status, sending reminders or building an employee performance ranking.</p></details></div>
   <div class="activity-card"><div class="activity-time">Independent case B · about 10 minutes</div><h3>Course completion report</h3><p>A training provider asks for the number of learners who completed a course in November. Its activity log records lesson openings, video plays, quiz starts and quiz submissions. It does not define course completion, and it does not state whether a learner must pass a final assessment or finish every required unit.</p><p><b>Write:</b> (1) why you cannot safely produce the count yet; and (2) one precise clarification question to ask the provider.</p><textarea maxlength="5000" id="activity-m1-a4" data-activity-id="m1-a4" placeholder="1. Missing definition...&#10;2. Clarification question...">${esc(drafts['m1-a4']||'')}</textarea><div class="activity-actions"><button class="btn" data-action="save-activity" data-activity="m1-a4">Save my response</button><span class="activity-saved" id="saved-m1-a4">${drafts['m1-a4']?'Saved in this browser':'Not saved yet'}</span></div><details class="model-answer"><summary>Show model answer and compare</summary><p><b>Why clarification is needed:</b> the recorded events describe activity but do not establish that a learner has completed the course. Different completion rules would produce different counts.</p><p><b>Clarification:</b> “What exact condition marks a course as completed for this report—for example, completing every required unit, passing the final assessment, or receiving an explicit completion status?”</p></details></div>
   <div class="lesson-rule"><b>Self-review checklist</b><span>Before continuing, check that your statements name the requested result, count or act on the correct real-world entity, preserve the stated conditions, avoid inventing a method and do not add unrequested deliverables. When the wording is genuinely ambiguous, ask instead of assuming.</span></div>
  </section>

  <section class="lesson-section"><div class="lesson-kicker">Part 5 · Mastery checkpoint · 5 minutes</div><h2>Check whether you can separate the task from the story</h2><p>The checkpoint contains six short scenario questions worth two marks each. You must submit each answer to receive marks and see the detailed explanation. The mastery threshold is 80% (at least 10 out of 12 marks). You may return to earlier questions, but an answer cannot be changed after submission.</p><div class="lesson-rule"><b>Before you start</b><span>Do not search for a familiar algorithm. For each question, identify the actual result, the entity involved and the conditions the story makes relevant.</span></div></section>

  <section class="lesson-section"><div class="lesson-kicker">Part 6 · Review · 2 minutes</div><h2>Keep this five-step reading routine</h2><div class="step-list"><div class="step-card"><b>1</b><strong>Read</strong><span>Understand the scenario before proposing a solution.</span></div><div class="step-card"><b>2</b><strong>Find</strong><span>Locate the requested outcome and action verb.</span></div><div class="step-card"><b>3</b><strong>Name</strong><span>Identify the real-world entity being acted on.</span></div><div class="step-card"><b>4</b><strong>Bound</strong><span>Keep stated conditions; reject scope creep.</span></div><div class="step-card"><b>5</b><strong>Clarify</strong><span>Ask when a missing definition changes the answer.</span></div></div><p><b>Remember:</b> A correct solution to the wrong interpretation is still the wrong answer. Define the task before you design the solution.</p></section>

  <section class="lesson-section"><div class="lesson-kicker">Further reading · instructional design</div><h2>Why this lesson is taught in this order</h2><p>The opening lesson uses a worked example, then guided activities, then independent cases. This is deliberate: novices benefit from seeing a complete reasoning path before the support is gradually reduced. The problem-framing skill itself is also treated as a distinct phase before solution design and solution analysis in computational-thinking research.</p><div class="source-list"><a href="https://eric.ed.gov/?id=EJ1248111" target="_blank" rel="noopener">Palts & Pedaste (2020) · A Model for Developing Computational Thinking Skills — problem definition, problem solving and solution analysis</a><a href="https://journals.sagepub.com/doi/10.1177/0963721420922183" target="_blank" rel="noopener">Sweller, van Merriënboer & Paas (2020) · Cognitive-Load Theory — worked-example and guidance-fading effects</a><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12124242/" target="_blank" rel="noopener">FADE-CTP (2025) · Framework for educational computational-thinking problems — analysis, abstraction, decomposition and representation</a></div></section>

  <div class="start-panel"><div><b>Lesson content completed?</b><p>Your written practice responses are saved to your student account. Continue to the six-question mastery checkpoint when you are ready.</p></div><button class="btn primary large" data-action="begin-questions" data-id="${id}">Start mastery checkpoint →</button></div>
 </div>`);
}

function renderQuestion(id,index){const qs=moduleQuestions(id);if(!qs.length){go('module/'+id,true);return;}index=Math.max(0,Math.min(Number(index)||0,qs.length-1));const q=qs[index],answers=state.answers[id]||{},answer=answers[q.id]||{},draft=(state.drafts[id]||{})[q.id]??answer.choice??null,submitted=Boolean(answer.submitted),total=qs.reduce((a,x)=>a+x.marks,0),score=scoreFor(id);setBodyMode(true);document.getElementById('appRoot').innerHTML=`<div class="quiz-app"><div class="quiz-top"><div><div class="quiz-brand">PROBLEM SOLVING LAB · LESSON ${String(id).padStart(2,'0')}</div><div class="brand-sub">${esc(moduleById(id).title)}</div></div><div class="quiz-top-right">Current score: <b>${score}/${total}</b></div></div><div class="quiz-progress"><i style="width:${((index+1)/qs.length)*100}%"></i></div><main class="quiz-main"><div class="quiz-meta"><span>Question ${index+1} of ${qs.length} · ${esc(q.title)}</span><span class="mark-pill">${q.marks} marks</span></div><section class="quiz-card"><div class="q-label">Read carefully · reason before selecting</div><h1>${esc(q.prompt)}</h1><div class="answer-options">${q.options.map((option,i)=>{let cls='';if(submitted&&i===q.correct)cls='correct';if(submitted&&i===answer.choice&&!answer.correct)cls='incorrect';return `<label class="answer-option ${cls}"><input type="radio" name="answerChoice" value="${i}" ${draft===i?'checked':''} ${submitted?'disabled':''}><span class="option-key">${String.fromCharCode(65+i)}.</span><span>${esc(option)}</span></label>`;}).join('')}</div><div class="hints">${q.hints.map((hint,i)=>{const open=Boolean((state.hints[id]||{})[q.id]?.includes(i));return `<div class="hint-box"><button data-action="hint" data-index="${index}" data-hint="${i}" data-id="${id}">${open?'Hide':'Show'} Hint ${i+1} ${open?'−':'+'}</button><div class="hint-content ${open?'show':''}">${esc(hint)}</div></div>`;}).join('')}</div><div class="submit-row"><button class="btn primary" data-action="submit-answer" data-id="${id}" data-index="${index}" ${submitted||draft===null?'disabled':''}>${submitted?'Answer submitted':'Submit Answer · '+q.marks+' marks'}</button><span class="submit-status" id="submitStatus">${submitted?`Submitted · ${answer.correct?q.marks:0}/${q.marks} marks awarded`:'Select one answer, then submit it to receive marks and the worked explanation.'}</span></div>${submitted?renderAnswerReview(q,answer):''}</section><div class="quiz-nav"><div class="nav-group"><button class="btn" data-action="prev-question" data-id="${id}" data-index="${index}" ${index===0?'disabled':''}>← Previous</button><button class="btn" data-action="next-question" data-id="${id}" data-index="${index}" ${!submitted||index===qs.length-1?'disabled':''}>Next →</button></div><div class="quiz-nav-note">${submitted?(index===qs.length-1?'All questions answered. View your result.':'Your answer is saved. You can move to the next question.'):'Submit your answer before moving forward.'}</div><button class="btn primary" data-action="show-result" data-id="${id}" data-index="${index}" ${index!==qs.length-1||!submitted?'disabled':''}>View result →</button></div></main></div>`;}
function renderAnswerReview(q,answer){return `<div class="answer-review ${answer.correct?'':'wrong'}"><h3>${answer.correct?'Your answer is correct':'Review the correct answer'}</h3><div class="marks-awarded">${answer.correct?q.marks:0} / ${q.marks} marks awarded</div><p><b>Your answer:</b> ${esc(q.options[answer.choice])}</p><p><b>Correct answer:</b> ${esc(q.options[q.correct])}</p><p><b>Detailed solution:</b> ${esc(q.explanation)}</p><div class="explain-options">${q.optionExplanations.map((ex,i)=>`<div><b>${String.fromCharCode(65+i)}.</b> ${esc(ex)}</div>`).join('')}</div></div>`;}
function renderResult(id){const qs=moduleQuestions(id),score=scoreFor(id),total=qs.reduce((a,q)=>a+q.marks,0),pct=total?Math.round(score/total*100):0,pass=passed(id),answers=state.answers[id]||{};if(!allSubmitted(id)){go(`question/${id}/0`,true);return;}const rows=qs.map((q,i)=>`<div class="breakdown-row"><span>Question ${i+1} · ${esc(q.title)}</span><b>${answers[q.id].correct?q.marks:0} / ${q.marks}</b></div>`).join('');setBodyMode(false);shell(`<div class="crumb">Lesson ${String(id).padStart(2,'0')} · Assessment result</div><div class="result-hero ${pass?'pass':'fail'}"><div class="score-circle"><b>${score}/${total}</b></div><h1>${pass?'Mastery checkpoint passed':'Checkpoint not yet passed'}</h1><p>You scored ${pct}%. The required threshold is ${PASS_PERCENT}%. ${pass?'You can now complete this lesson and unlock the next lesson in sequence.':'Review the explanations, revisit the lesson content and retry the checkpoint.'}</p><div class="result-breakdown">${rows}</div><div class="result-actions">${pass?`<button class="btn primary large" data-action="complete-module" data-id="${id}">Complete lesson & unlock next →</button>`:`<button class="btn primary large" data-action="retry-module" data-id="${id}">Retry checkpoint</button>`}<button class="btn" data-action="review-questions" data-id="${id}">Review answers</button><button class="btn" data-action="stage" data-id="${moduleById(id).stage}">Return to learning path</button></div></div>`);}
function renderRoute(){let r=routeNow().split('/');const view=r[0];const id=Number(r[1]);const ix=Number(r[2]||0);if(view==='home'){renderHome();return;}if(view==='stage'){renderStage(id);return;}if(view==='module'){renderModuleOverview(id);return;}if(view==='lesson'){renderLesson(id);return;}if(view==='question'){renderQuestion(id,ix);return;}if(view==='result'){renderResult(id);return;}go('home',true);}
function updateDraft(){const radio=document.querySelector('input[name="answerChoice"]:checked');if(!radio)return;const parts=routeNow().split('/');const id=Number(parts[1]),index=Number(parts[2]);const q=moduleQuestions(id)[index];if(!q)return;const ans=(state.answers[id]||{})[q.id];if(ans?.submitted)return;state.drafts[id]=state.drafts[id]||{};state.drafts[id][q.id]=Number(radio.value);saveState();const btn=document.querySelector('[data-action="submit-answer"]');if(btn)btn.disabled=false;}
function submitAnswer(id,index){const q=moduleQuestions(id)[index];if(!q)return;const existing=(state.answers[id]||{})[q.id];if(existing?.submitted)return;const choice=state.drafts[id]?.[q.id];if(choice===undefined||choice===null){const status=document.getElementById('submitStatus');if(status)status.textContent='Choose an option before submitting.';return;}const correct=Number(choice)===q.correct;state.answers[id]=state.answers[id]||{};state.answers[id][q.id]={choice:Number(choice),correct,submitted:true,submittedAt:new Date().toISOString()};saveState();renderQuestion(id,index);}
function toggleHint(id,index,hintIndex){const q=moduleQuestions(id)[index];if(!q)return;state.hints[id]=state.hints[id]||{};const arr=state.hints[id][q.id]||[];state.hints[id][q.id]=arr.includes(hintIndex)?arr.filter(x=>x!==hintIndex):[...arr,hintIndex];saveState();renderQuestion(id,index);}
function completeModule(id){if(!passed(id))return;if(!isDone(id)){state.completed.push(Number(id));state.completed.sort((a,b)=>a-b);}state.lastModule=Number(id);saveState();go('stage/'+moduleById(id).stage);}
function exportProgress(){const payload={course:'Problem Solving Lab 100H',version:4,exportedAt:new Date().toISOString(),progress:state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='problem-solving-lab-progress.json';a.click();URL.revokeObjectURL(url);}
function resetProgress(){if(!confirm('Reset all saved learning progress in this browser? This cannot be undone unless you exported a backup.'))return;state=freshState();saveState();go('home',true);}
document.addEventListener('change',e=>{if(e.target.matches('input[name="answerChoice"]'))updateDraft();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="save-activity"]');if(!b)return;const key=b.dataset.activity,field=document.querySelector('[data-activity-id="'+key+'"]');if(!field)return;state.activityDrafts=state.activityDrafts||{};state.activityDrafts[key]=field.value;saveState();const status=document.getElementById('saved-'+key);if(status)status.textContent=window.parent!==window?'Saving to your student account…':'Saved in this browser';if(window.parent!==window)window.parent.postMessage({type:'PSL_ACTIVITY_SAVED',moduleNumber:1,activityId:key,response:field.value},location.origin);});
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent)return;const d=e.data||{};if(d.type==='PSL_ACTIVITY_SAVED_RESULT'){const status=document.getElementById('saved-'+d.activityId);if(status)status.textContent=d.ok?'Saved to your student account':(d.message||'Could not sync. Retry saving.');}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=Number(b.dataset.id),index=Number(b.dataset.index||0);if(a==='home')go('home');else if(a==='stage')go('stage/'+id);else if(a==='module')go('module/'+id);else if(a==='start-module')go('lesson/'+id);else if(a==='begin-questions'){if(window.parent!==window){window.parent.postMessage({type:'PSL_OPEN_ASSESSMENT',moduleNumber:id},location.origin);}else{go('question/'+id+'/0');}}else if(a==='submit-answer')submitAnswer(id,index);else if(a==='prev-question')go('question/'+id+'/'+Math.max(0,index-1));else if(a==='next-question'){const q=moduleQuestions(id)[index],ans=state.answers[id]?.[q?.id];if(ans?.submitted)go('question/'+id+'/'+(index+1));}else if(a==='show-result'){const q=moduleQuestions(id)[index],ans=state.answers[id]?.[q?.id];if(ans?.submitted&&index===moduleQuestions(id).length-1)go('result/'+id);}else if(a==='hint')toggleHint(id,index,Number(b.dataset.hint));else if(a==='complete-module')completeModule(id);else if(a==='retry-module'){state.answers[id]={};state.drafts[id]={};state.hints[id]={};saveState();go('question/'+id+'/0');}else if(a==='review-questions')go('question/'+id+'/0');else if(a==='export')exportProgress();else if(a==='reset')resetProgress();});
window.addEventListener('popstate',renderRoute);
window.addEventListener('keydown',e=>{if(!document.body.classList.contains('quiz-mode')||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;const parts=routeNow().split('/');if(parts[0]!=='question')return;const id=Number(parts[1]),ix=Number(parts[2]||0),q=moduleQuestions(id)[ix],ans=state.answers[id]?.[q?.id];if(e.key==='ArrowLeft'&&ix>0)go(`question/${id}/${ix-1}`);if(e.key==='ArrowRight'&&ans?.submitted&&ix<moduleQuestions(id).length-1)go(`question/${id}/${ix+1}`);});
renderRoute();
</script></body></html>
